<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .redbox {
            position: absolute;
            width: 35rem;
            height: 50rem;
            background-color: #c70b0b;
        }
        .greybox {
            margin: auto;
            width: 60%;
            padding: 10px;
            height: auto;
            background-color: #d9d9d9;
            width: 40rem;
            border-radius: 15px;
        }
        html * {
            font-family: Nunito, sans-serif;
        }
        body {
            background-image: url('Forest.jpg');
            background-repeat: no-repeat;
            background-attachment: fixed;  
            background-size: cover;
        }
        .box {
            display: block;
            width: 100%;
            border: none;
            background-color: #d9d9d9;
            color: black;
            height: 50px;
            width: 400px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            border-radius: 15px;
        }
        .box2 {
            margin: auto;
            display: block;
            width: 100%;
            border: none;
            background-color: #c70b0b;
            color: white;
            height: 50px;
            width: 400px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            border-radius: 15px;
        }
        .small-box {
            margin: auto;
            display: block;
            width: 100%;
            border: none;
            background-color: #c70b0b;
            color: white;
            height: 40px;
            width: 200px; /* Smaller width to fit in greybox */
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            border-radius: 10px;
        }
        p {
            margin: auto;
            display: block;
            width: 100%;
            border: none;
            background-color: #c70b0b;
            color: white;
            height: 40px;
            width: 600px;
            font-size: 20px;
            text-align: center;
            border-radius: 15px;
        }
        .dropbtn {
            background-color: #c70b0b;
            color: white;
            padding: 16px;
            font-size: 16px;
            border: none;
        }
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f1f1f1;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }
        .dropdown-content a:hover {
            background-color: #ddd;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .dropdown:hover .dropbtn {
            background-color: #3e8e41;
        }

        /* Separate grey box for ADD, EDIT, DELETE, OPTIMIZE, AUTO-OPTIMIZE */
        .small-greybox {
            margin: auto;
            width: 60%;
            padding: 10px;
            height: auto;
            background-color: #e0e0e0;
            width: 45rem;
            border-radius: 15px;
            text-align: center;
        }

        /* Layout for 3 buttons on top, 2 buttons below */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 10px;
            justify-items: center;
        }
        .button-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 10px;
            justify-items: center;
        }
    </style>
</head>
<body>

<div class="redbox">
    <center>
        <br>
        <img src="360_F_229758328_7x8jwCwjtBMmC6rgFzLFhZoEpLobB6L8.jpg" alt="User Icon" width="200" height="200"><br><br>
        <button class="box" onclick="document.location=''">ACCOUNT</button> <br>
        <button class="box" onclick="document.location=''">INVENTORY</button> <br>
        <button class="box" onclick="document.location=''">SERVICES</button> <br>
        <button class="box" onclick="document.location=''">PRODUCTS</button> <br>
        <button class="box" onclick="document.location=''">ABOUT US</button> <br>
        <button class="box" onclick="document.location=''">LOG OUT</button> <br>
    </center>
</div>

<div class="greybox">
    <br>
    <button class="box2" onclick="document.location=''">Mercury MerCruiser 4.5L</button> <br>
    <button class="box2" onclick="document.location=''">Mercury MerCruiser 8.2L</button> <br>
    <button class="box2" onclick="document.location=''">Mercury MerCruiser 6.2L 350HP</button> <br>
    <button class="box2" onclick="document.location=''">Mercury MerCruiser 8.2L 425HP</button> <br>
    <button class="box2" onclick="document.location=''">Mercury MerCruiser T6200 Towsport Inboard</button> <br>
    <button class="box2" onclick="document.location=''">Mercury Avator 25e</button> <br>
    <button class="box2" onclick="document.location=''">Mercury MerCruiser 6.2L 350HP</button> <br>

    <center>
        <div class="dropdown">
            <button class="dropbtn">More Options</button>
            <div class="dropdown-content">
                <a href="#">OPTION 1</a>
                <a href="#">OPTION 2</a>
                <a href="#">OPTION 3</a>
            </div>
        </div>
    </center>
    <br>
</div>
<br>

<div class="small-greybox">
    <center>
        <div class="button-grid">
            <button class="small-box" onclick="document.location=''">ADD</button>
            <button class="small-box" onclick="document.location=''">EDIT</button>
            <button class="small-box" onclick="document.location=''">DELETE</button>
        </div>
        <br>
        <div class="button-grid-2">
            <button class="small-box" onclick="document.location=''">OPTIMIZE</button>
            <button class="small-box" onclick="document.location=''">AUTO-OPTIMIZE</button>
        </div>
    </center>
</div>

</body>
</html>
